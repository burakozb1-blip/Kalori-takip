<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Beslenme Takip</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap');

* { box-sizing: border-box; }
html, body { margin:0; padding:0; background:#F3F4EF; height:100%; overflow:hidden; }
body {
  font-family: 'Manrope', -apple-system, sans-serif;
  color:#1B231E;
  -webkit-font-smoothing: antialiased;
}
.app {
  --bg:#F3F4EF; --surface:#FFFFFF; --surface-2:#ECEEE7;
  --ink:#1B231E; --ink-muted:#63706A; --line:#DBDFD5;
  --good:#3F7D5C; --good-bg:#E5F0E9; --over:#C4622E; --over-bg:#FBE7DC;
  background: var(--bg);
  color: var(--ink);
  max-width: 480px;
  margin: 0 auto;
  height: 100vh;
  height: 100dvh;
  position: relative;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.loading-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; min-height:100vh; }
.spinner { width:28px; height:28px; border:3px solid var(--line); border-top-color:#3F7D5C; border-radius:50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.screen { padding: 16px 16px 8px; flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.screen-title { font-size: 19px; font-weight: 800; margin: 4px 0 14px; }
.bottom-spacer { height: 24px; }
.muted { color: var(--ink-muted); }
.small { font-size: 12px; }
svg.ic { display:block; }

.date-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom: 14px; }
.date-label { display:flex; flex-direction:column; align-items:center; font-weight:700; font-size:14px; position:relative; }
.date-input-hidden { position:absolute; opacity:0; width:100%; height:100%; cursor:pointer; left:0; top:0; }
.date-input.full { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:9px; font-family:inherit; background:var(--surface); color:var(--ink); font-size:13px; }

.icon-btn { background:var(--surface); border:1px solid var(--line); border-radius:10px; width:36px; height:36px; display:flex; align-items:center; justify-content:center; color:var(--ink); cursor:pointer; }
.icon-btn:disabled { opacity: .35; cursor:default; }
.icon-btn.tiny { width:28px; height:28px; border:none; background:transparent; color:var(--ink-muted); }

.banner { display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:10px; font-size:12.5px; font-weight:600; margin-bottom:12px; }
.banner.over { background: var(--over-bg); color:#8A3D18; }
.banner.info { background: var(--surface-2); color: var(--ink-muted); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
.card.hero { display:flex; justify-content:center; padding: 22px 16px; }
.card-title { font-size: 14px; font-weight: 700; margin: 0 0 10px; }

.ring-wrap { position:relative; display:flex; align-items:center; justify-content:center; width:176px; height:176px; }
.ring-center { position:absolute; display:flex; flex-direction:column; align-items:center; }
.ring-kcal { font-size: 30px; font-weight: 800; line-height:1; font-variant-numeric: tabular-nums; }
.ring-sub { font-size: 12px; color: var(--ink-muted); margin-top:2px; }
.ring-remain { font-size: 12px; font-weight:700; margin-top:6px; color: var(--good); }
.ring-remain.over { color: var(--over); }

.macro-row { margin-bottom: 12px; }
.macro-row:last-child { margin-bottom: 0; }
.macro-row-top { display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:5px; }
.macro-name { font-weight: 700; }
.macro-nums { color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.macro-track { height:8px; background: var(--surface-2); border-radius:6px; overflow:hidden; }
.macro-fill { height:100%; border-radius:6px; transition: width .4s ease; }

.water-card .water-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.water-title { display:flex; align-items:center; gap:6px; font-weight:700; font-size:13px; color:#2E6FA3; }
.water-track { height:8px; background:var(--surface-2); border-radius:6px; overflow:hidden; margin-bottom:10px; }
.water-fill { height:100%; background:#5B9BC9; border-radius:6px; transition: width .4s ease; }

.meals { margin-top: 4px; }
.meal-block { margin-bottom: 16px; }
.meal-head { display:flex; justify-content:space-between; font-weight:800; font-size:13.5px; padding-bottom:6px; border-bottom:1px solid var(--line); margin-bottom:6px; }
.meal-empty { color: var(--ink-muted); font-size:12.5px; padding: 4px 0 6px; }
.entry-row { display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); }
.entry-row:last-child { border-bottom:none; }
.entry-main { min-width:0; }
.entry-name { font-weight:700; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width: 230px; }
.entry-actions { display:flex; gap:4px; flex-shrink:0; }

.add-food-btn { width:100%; display:flex; align-items:center; justify-content:center; gap:6px; background:var(--ink); color:#fff; border:none; border-radius:14px; padding:14px; font-weight:800; font-size:14px; font-family:inherit; cursor:pointer; }

.bottom-nav { position: relative; flex: 0 0 auto; width:100%; background:var(--surface); border-top:1px solid var(--line); display:flex; align-items:center; justify-content:space-around; padding: 10px 6px calc(16px + env(safe-area-inset-bottom)); z-index: 20; }
.nav-btn { display:flex; flex-direction:column; align-items:center; gap:2px; background:none; border:none; color:var(--ink-muted); font-size:10px; font-family:inherit; font-weight:600; padding:4px 6px; cursor:pointer; }
.nav-btn.active { color: var(--good); }
.fab { width:52px; height:52px; border-radius:50%; background:var(--good); color:#fff; border:none; display:flex; align-items:center; justify-content:center; margin-top:-26px; box-shadow: 0 4px 14px rgba(63,125,92,.4); cursor:pointer; }

.overlay { position:fixed; inset:0; background:rgba(20,24,20,.45); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
.sheet { background:var(--bg); width:100%; max-width:480px; border-radius:20px 20px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto; }
.sheet.small { border-radius:20px; margin:0 16px; max-width:440px; }
.sheet-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.sheet-head h3 { margin:0; font-size:16px; }
.sheet h3 { font-size:16px; margin: 0 0 6px; }

.search-box { display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:10px; }
.search-box input { border:none; outline:none; background:none; font-family:inherit; font-size:14px; width:100%; color:var(--ink); }
.food-list { max-height: 260px; overflow-y:auto; margin-bottom: 8px; }
.food-item { width:100%; display:flex; justify-content:space-between; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:11px 12px; margin-bottom:6px; font-family:inherit; text-align:left; cursor:pointer; }
.link-btn { background:none; border:none; color: var(--good); font-weight:700; font-size:12.5px; font-family:inherit; padding: 6px 2px; cursor:pointer; }

.picked-panel, .manual-panel { display:flex; flex-direction:column; gap:10px; }
.macro-preview { display:flex; flex-direction:column; gap:2px; background:var(--surface-2); border-radius:10px; padding:10px 12px; font-weight:700; }
.meal-time-row { margin: 4px 0; }

.field { display:flex; flex-direction:column; gap:5px; font-size:12.5px; font-weight:700; margin-bottom:10px; flex:1; }
.field input { font-family:inherit; font-size:14px; font-weight:500; padding:10px 11px; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); width:100%; }

.row-2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.row-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
.row-4 { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:6px; }
.filter-row { margin-bottom: 10px; }

.chip { background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:8px 4px; font-size:12px; font-weight:700; font-family:inherit; color:var(--ink); text-align:center; cursor:pointer; }
.chip-active { background:var(--ink); color:#fff; border-color:var(--ink); }

.btn { border:none; border-radius:12px; padding:12px 16px; font-weight:800; font-size:14px; font-family:inherit; display:flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; }
.btn.full { width:100%; margin-top: 4px; }
.btn.primary { background:var(--ink); color:#fff; }
.btn.primary:disabled { opacity:.4; cursor:default; }
.btn.ghost { background:var(--surface-2); color:var(--ink); }
.btn.danger { background:var(--over); color:#fff; }
.btn.danger-ghost { background:var(--over-bg); color:#8A3D18; }

.empty-state { color: var(--ink-muted); font-size:13px; text-align:center; padding: 24px 8px; }
.empty-state.small { padding: 10px 4px; font-size:12px; }

.pill { font-size:11px; font-weight:800; padding:4px 9px; border-radius:999px; background:var(--surface-2); color:var(--ink-muted); font-variant-numeric: tabular-nums; }
.pill.over { background: var(--over-bg); color:#8A3D18; }
.pill.good { background: var(--good-bg); color: var(--good); }

.log-day { padding: 12px 14px; }
.log-day-head { width:100%; display:flex; justify-content:space-between; align-items:center; background:none; border:none; font-family:inherit; font-weight:800; font-size:13.5px; padding: 0 0 8px; border-bottom:1px solid var(--line); margin-bottom:6px; text-align:left; cursor:pointer; color:var(--ink); }

.stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.stat-box { background:var(--surface-2); border-radius:12px; padding:14px; text-align:center; }
.stat-num { font-size:26px; font-weight:800; font-variant-numeric: tabular-nums; }

.pie-row { display:flex; align-items:center; gap:14px; }
.pie-legend { display:flex; flex-direction:column; gap:8px; flex:1; }
.pie-legend-row { display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; }
.pie-legend-row .muted { margin-left:auto; }
.dot { width:9px; height:9px; border-radius:50%; display:inline-block; }

.dev-row { display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); }
.dev-row:last-child { border-bottom:none; }

.export-area { width:100%; height:160px; font-family: ui-monospace, monospace; font-size:11px; border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:10px; background:var(--surface); color:var(--ink); resize:none; }
.storage-status { display:inline-flex; align-items:center; gap:6px; font-weight:800; font-size:14px; padding:8px 12px; border-radius:10px; background:var(--surface-2); }
.storage-status.cloud { background:#E4EEF7; color:#2E6FA3; }
.storage-status.local { background:var(--surface-2); color:var(--ink-muted); }

.chart-box { position:relative; width:100%; }
.chart-box svg { display:block; }
.legend-row { display:flex; align-items:center; gap:6px; margin-top:8px; flex-wrap:wrap; }
.legend-row .dot.dash { width:14px; height:0; border-top:2px dashed; background:none; border-radius:0; }
</style>
</head>
<body>
<div id="app"><div class="app loading-screen"><div class="spinner"></div><p>Veriler yükleniyor…</p></div></div>

<script>
/* ============================== VERİ ============================== */

const MEAL_LABELS = { kahvalti: "Kahvaltı", ogle: "Öğle", aksam: "Akşam", ara: "Ara Öğün" };
const MEAL_ORDER = ["kahvalti", "ogle", "aksam", "ara"];
const MACRO_COLORS = { protein: "#3F7D5C", carb: "#C9A227", fat: "#6E5A9E" };
const WEEKDAYS_TR = ["Paz", "Pzt", "Sal", "Çar", "Per", "Cum", "Cmt"];
const WEEKDAYS_ORDER = ["Pzt", "Sal", "Çar", "Per", "Cum", "Cmt", "Paz"];
const DEFAULT_SETTINGS = { calories: 2200, protein: 150, carb: 260, fat: 70, fiber: 30, water: 2500 };

/* ============================== YARDIMCI FONKSİYONLAR ============================== */

function toISO(d) { return d.toISOString().slice(0, 10); }
function todayISO() { return toISO(new Date()); }
function addDays(iso, n) { const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() + n); return toISO(d); }
function dateLabel(iso) { const d = new Date(iso + "T00:00:00"); return d.toLocaleDateString("tr-TR", { day: "2-digit", month: "short" }); }
function fullDateLabel(iso) { const d = new Date(iso + "T00:00:00"); return d.toLocaleDateString("tr-TR", { weekday: "long", day: "2-digit", month: "long" }); }
function weekdayOf(iso) { const d = new Date(iso + "T00:00:00"); return WEEKDAYS_TR[d.getDay()]; }
function fmt(n) { return Math.round(n || 0).toLocaleString("tr-TR"); }
function fmt1(n) { return (Math.round((n || 0) * 10) / 10).toLocaleString("tr-TR"); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function guessMeal() { const h = new Date().getHours(); if (h < 11) return "kahvalti"; if (h < 16) return "ogle"; if (h < 21) return "aksam"; return "ara"; }
function nowTime() { const d = new Date(); return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; }
function emptyTotals() { return { kcal: 0, protein: 0, carb: 0, fat: 0, fiber: 0 }; }
function sumEntries(list) {
  return list.reduce((acc, e) => { acc.kcal += e.kcal; acc.protein += e.protein; acc.carb += e.carb; acc.fat += e.fat; acc.fiber += e.fiber || 0; return acc; }, emptyTotals());
}
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

/* ============================== İKONLAR ============================== */

const ICON_PATHS = {
  home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  list: '<line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>',
  bar: '<line x1="6" y1="20" x2="6" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="18" y1="20" x2="18" y2="14"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>',
  plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  chevronLeft: '<polyline points="15 18 9 12 15 6"/>',
  chevronRight: '<polyline points="9 18 15 12 9 6"/>',
  pencil: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4z"/>',
  trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/>',
  droplet: '<path d="M12 2s7 8.5 7 13a7 7 0 11-14 0c0-4.5 7-13 7-13z"/>',
  download: '<path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
  check: '<polyline points="20 6 9 17 4 12"/>',
  alert: '<path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
  search: '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
  scale: '<path d="M5 21h14"/><path d="M5 21V9l7-6 7 6v12"/><circle cx="12" cy="14" r="3"/>',
};
function icon(name, size = 20) {
  return `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[name] || ""}</svg>`;
}

/* ============================== DURUM (STATE) ============================== */

let state = {
  loaded: false,
  settings: { ...DEFAULT_SETTINGS },
  entries: [],
  weights: [],
  water: {},
  tab: "today",
  selectedDate: todayISO(),
  range: 7,
  customFrom: addDays(todayISO(), -13),
  customTo: todayISO(),
  modal: null,          // 'add' | 'weight' | 'export' | null
  confirmDelete: null,  // id
  confirmReset: false,
  savedFlash: false,
};

let modalState = null; // yemek ekleme modalı için lokal durum

/* ============================== FIREBASE (BULUT) YAPILANDIRMASI ============================== */
// Firebase kurulum rehberinin 2. adımından sonra buraya firebaseConfig objesini yapıştır.
// Boş bıraktığın sürece uygulama otomatik olarak bu cihazın yerel depolamasını (localStorage) kullanır.
const FIREBASE_CONFIG = null;
/* örnek:
const FIREBASE_CONFIG = {
  apiKey: "...",
  authDomain: "kalori-takip.firebaseapp.com",
  projectId: "kalori-takip",
  storageBucket: "kalori-takip.appspot.com",
  messagingSenderId: "...",
  appId: "..."
};
*/

let db = null;
let usingCloud = false;
const FIRESTORE_COLLECTION = "kalori_takip";
const FIRESTORE_DOC_ID = "veri";

function initFirebase() {
  if (!FIREBASE_CONFIG) return false;
  try {
    if (typeof firebase === "undefined") return false;
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    return true;
  } catch (err) {
    console.error("Firebase başlatılamadı, yerel depolamaya geçiliyor:", err);
    return false;
  }
}
function firestoreDocRef() { return db.collection(FIRESTORE_COLLECTION).doc(FIRESTORE_DOC_ID); }

/* ============================== VERİ YÜKLEME / KAYDETME (bulut veya yerel) ============================== */

const STORAGE_PREFIX = "beslenme_takip_";

function storageGet(key) {
  try { return localStorage.getItem(STORAGE_PREFIX + key); } catch (err) { console.error("Depolama okunamadı:", err); return null; }
}
function storageSet(key, value) {
  try { localStorage.setItem(STORAGE_PREFIX + key, value); return true; } catch (err) { console.error("Depolamaya yazılamadı:", err); return false; }
}

async function loadData() {
  usingCloud = initFirebase();

  if (usingCloud) {
    try {
      const snap = await firestoreDocRef().get();
      if (snap.exists) {
        const data = snap.data();
        if (data.settings && typeof data.settings === "object") state.settings = { ...DEFAULT_SETTINGS, ...data.settings };
        if (Array.isArray(data.entries)) state.entries = data.entries.filter((x) => x && typeof x === "object" && x.date && typeof x.kcal === "number");
        if (data.water && typeof data.water === "object") state.water = data.water;
        if (Array.isArray(data.weights)) state.weights = data.weights.filter((x) => x && x.date && typeof x.kg === "number");
      }
    } catch (err) {
      console.error("Firestore okunamadı, yerel depolamaya geçiliyor:", err);
      usingCloud = false;
    }
  }

  if (!usingCloud) {
    try {
      const s = storageGet("settings");
      const e = storageGet("entries");
      const w = storageGet("water");
      const wt = storageGet("weights");
      if (s) {
        try { const parsed = JSON.parse(s); if (parsed && typeof parsed === "object") state.settings = { ...DEFAULT_SETTINGS, ...parsed }; }
        catch { console.warn("Bozuk 'settings' verisi yok sayıldı, varsayılana dönülüyor."); }
      }
      if (e) {
        try { const parsed = JSON.parse(e); state.entries = Array.isArray(parsed) ? parsed.filter((x) => x && typeof x === "object" && x.date && typeof x.kcal === "number") : []; }
        catch { console.warn("Bozuk 'entries' verisi yok sayıldı."); state.entries = []; }
      }
      if (w) {
        try { const parsed = JSON.parse(w); state.water = (parsed && typeof parsed === "object" && !Array.isArray(parsed)) ? parsed : {}; }
        catch { console.warn("Bozuk 'water' verisi yok sayıldı."); state.water = {}; }
      }
      if (wt) {
        try { const parsed = JSON.parse(wt); state.weights = Array.isArray(parsed) ? parsed.filter((x) => x && x.date && typeof x.kg === "number") : []; }
        catch { console.warn("Bozuk 'weights' verisi yok sayıldı."); state.weights = []; }
      }
    } catch (err) { console.error("Yükleme hatası:", err); }
  }

  state.loaded = true;
  try { render(); } catch (err) { showFatalError("ilk yükleme: " + err.message); }
}

async function persist(key, value) {
  if (usingCloud) {
    try { await firestoreDocRef().set({ [key]: value }, { merge: true }); return; }
    catch (err) { console.error("Firestore'a yazılamadı, yerel depolamaya düşülüyor:", err); usingCloud = false; }
  }
  storageSet(key, JSON.stringify(value));
}

function saveEntryFromModal(entryData) {
  if (modalState.editId) {
    state.entries = state.entries.map((e) => (e.id === modalState.editId ? { ...entryData, id: modalState.editId } : e));
  } else {
    state.entries = [...state.entries, { ...entryData, id: uid() }];
  }
  persist("entries", state.entries);
  state.modal = null; modalState = null;
  render();
}
function deleteEntry(id) {
  state.entries = state.entries.filter((e) => e.id !== id);
  persist("entries", state.entries);
  state.confirmDelete = null;
  render();
}
function addWater(iso, ml) {
  state.water = { ...state.water, [iso]: Math.max(0, (state.water[iso] || 0) + ml) };
  persist("water", state.water);
  render();
}
function addWeight(iso, kg) {
  state.weights = [...state.weights.filter((w) => w.date !== iso), { date: iso, kg }].sort((a, b) => a.date.localeCompare(b.date));
  persist("weights", state.weights);
  state.modal = null;
  render();
}
function resetAll() {
  state.settings = { ...DEFAULT_SETTINGS };
  state.entries = [];
  state.water = {};
  state.weights = [];
  persist("settings", state.settings);
  persist("entries", state.entries);
  persist("water", state.water);
  persist("weights", state.weights);
  state.confirmReset = false;
  render();
}

/* ============================== HESAPLAMALAR ============================== */

function getDayEntries(iso) { return state.entries.filter((e) => e.date === iso).sort((a, b) => (a.time || "").localeCompare(b.time || "")); }

function getRangeDates() {
  let from, to;
  if (state.range === "custom") { from = state.customFrom; to = state.customTo; }
  else { to = todayISO(); from = addDays(to, -(state.range - 1)); }
  const list = []; let cur = from; let guard = 0;
  while (cur && to && cur <= to && guard < 400) { list.push(cur); cur = addDays(cur, 1); guard++; }
  return list.length ? list : [todayISO()];
}

function computeRangeStats() {
  const rangeDates = getRangeDates();
  const perDay = rangeDates.map((iso) => {
    const t = sumEntries(state.entries.filter((e) => e.date === iso));
    const dev = state.settings.calories > 0 ? ((t.kcal - state.settings.calories) / state.settings.calories) * 100 : 0;
    return { date: iso, ...t, deviation: dev, hasEntries: state.entries.some((e) => e.date === iso) };
  });
  const loggedDays = perDay.filter((d) => d.hasEntries);
  const onTarget = loggedDays.filter((d) => Math.abs(d.deviation) <= 10);
  const consistencyScore = perDay.length ? Math.round((onTarget.length / perDay.length) * 100) : 0;

  const byWeekday = {};
  loggedDays.forEach((d) => { const wd = weekdayOf(d.date); (byWeekday[wd] ||= []).push(d.deviation); });
  const weekdayChart = WEEKDAYS_ORDER.map((wd) => ({
    gun: wd, sapma: byWeekday[wd] ? Math.round(byWeekday[wd].reduce((a, b) => a + b, 0) / byWeekday[wd].length) : 0,
  }));

  const topDays = [...loggedDays].sort((a, b) => Math.abs(b.deviation) - Math.abs(a.deviation)).slice(0, 5).map((d) => {
    const mealsThatDay = state.entries.filter((e) => e.date === d.date);
    const byMeal = {};
    mealsThatDay.forEach((e) => { byMeal[e.meal] = (byMeal[e.meal] || 0) + e.kcal; });
    const dominant = Object.entries(byMeal).sort((a, b) => b[1] - a[1])[0];
    return { ...d, dominantMeal: dominant ? MEAL_LABELS[dominant[0]] : "-" };
  });

  const allByDate = {};
  state.entries.forEach((e) => { (allByDate[e.date] ||= []).push(e); });
  let streak = 0, checkDate = todayISO(), guard2 = 0;
  while (guard2 < 3650) {
    const dayList = allByDate[checkDate];
    if (!dayList || dayList.length === 0) break;
    const t = sumEntries(dayList);
    const dev = state.settings.calories > 0 ? Math.abs((t.kcal - state.settings.calories) / state.settings.calories) * 100 : 100;
    if (dev > 10) break;
    streak++; checkDate = addDays(checkDate, -1); guard2++;
  }

  const lineLabels = perDay.map((d) => dateLabel(d.date));
  const lineActual = perDay.map((d) => (d.hasEntries ? Math.round(d.kcal) : null));
  const lineTarget = perDay.map(() => state.settings.calories);

  return { perDay, rangeDates, consistencyScore, weekdayChart, topDays, streak, lineLabels, lineActual, lineTarget };
}

function render() {
  const app = document.getElementById("app");
  if (!state.loaded) { app.innerHTML = `<div class="app loading-screen"><div class="spinner"></div><p>Veriler yükleniyor…</p></div>`; return; }

  try {
    let html = `<div class="app">`;
    if (state.tab === "today") html += renderToday();
    else if (state.tab === "log") html += renderLog();
    else if (state.tab === "stats") html += renderStats();
    else if (state.tab === "settings") html += renderSettings();

    html += renderBottomNav();
    html += renderModals();
    html += `</div>`;
    app.innerHTML = html;
  } catch (err) {
    showFatalError("render (" + state.tab + "): " + err.message);
  }
}

/* ============================== SVG GRAFİKLER (harici kütüphane yok) ============================== */

function svgLineChart(labels, actualArr, target) {
  const W = 320, H = 200, padL = 34, padR = 8, padT = 12, padB = 22;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const validVals = actualArr.filter((v) => v !== null && v !== undefined);
  const maxVal = Math.max(target, ...(validVals.length ? validVals : [0])) * 1.15 || 1;
  const n = labels.length || 1;
  const xStep = n > 1 ? plotW / (n - 1) : 0;
  const xOf = (i) => padL + i * xStep;
  const yOf = (v) => padT + (1 - v / maxVal) * plotH;

  // segmentlere ayırarak çizgi (null olan günlerde boşluk bırak)
  let segments = [], cur = [];
  actualArr.forEach((v, i) => {
    if (v === null || v === undefined) { if (cur.length) segments.push(cur); cur = []; }
    else cur.push([xOf(i), yOf(v)]);
  });
  if (cur.length) segments.push(cur);
  const pathFor = (pts) => "M " + pts.map((p) => p.join(",")).join(" L ");

  const dots = [];
  actualArr.forEach((v, i) => { if (v !== null && v !== undefined) dots.push(`<circle cx="${xOf(i)}" cy="${yOf(v)}" r="2.6" fill="#1B231E"/>`); });

  const targetY = yOf(target);
  // x ekseni etiketleri: çok kalabalık olmasın diye aralıklı göster
  const labelStep = Math.max(1, Math.ceil(n / 6));
  const xLabels = labels.map((l, i) => (i % labelStep === 0 || i === n - 1) ? `<text x="${xOf(i)}" y="${H - 6}" font-size="9" fill="#63706A" text-anchor="middle">${esc(l)}</text>` : "").join("");

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" style="overflow:visible">
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H - padB}" stroke="#DBDFD5"/>
    <line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="#DBDFD5"/>
    <text x="2" y="${padT + 4}" font-size="9" fill="#63706A">${fmt(maxVal)}</text>
    <text x="2" y="${H - padB}" font-size="9" fill="#63706A">0</text>
    <line x1="${padL}" y1="${targetY}" x2="${W - padR}" y2="${targetY}" stroke="#3F7D5C" stroke-width="1.5" stroke-dasharray="5 4"/>
    ${segments.map((seg) => `<path d="${pathFor(seg)}" fill="none" stroke="#1B231E" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/>`).join("")}
    ${dots.join("")}
    ${xLabels}
  </svg>`;
}

function svgDoughnut(segments) {
  const size = 140, thickness = 24, cx = size / 2, cy = size / 2;
  const r = (size - thickness) / 2, circumference = 2 * Math.PI * r;
  const total = segments.reduce((a, s) => a + s.value, 0) || 1;
  let cumulative = 0;
  const circles = segments.map((s) => {
    const len = (s.value / total) * circumference;
    const dasharray = `${len} ${circumference - len}`;
    const dashoffset = -cumulative;
    cumulative += len;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${thickness}" stroke-dasharray="${dasharray}" stroke-dashoffset="${dashoffset}" transform="rotate(-90 ${cx} ${cy})"/>`;
  }).join("");
  return `<svg viewBox="0 0 ${size} ${size}" width="140" height="140">${circles}</svg>`;
}

function svgDeviationBars(data) {
  const W = 320, H = 170, padL = 30, padR = 8, padT = 10, padB = 20;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const maxAbs = Math.max(10, ...data.map((d) => Math.abs(d.sapma)));
  const zeroY = padT + plotH / 2;
  const n = data.length;
  const slot = plotW / n;
  const barW = slot * 0.55;
  const bars = data.map((d, i) => {
    const barH = (Math.abs(d.sapma) / maxAbs) * (plotH / 2);
    const x = padL + i * slot + (slot - barW) / 2;
    const y = d.sapma >= 0 ? zeroY - barH : zeroY;
    const color = d.sapma > 10 ? "#C4622E" : d.sapma < -10 ? "#C9A227" : "#3F7D5C";
    return `<rect x="${x}" y="${y}" width="${barW}" height="${Math.max(barH, 1)}" rx="3" fill="${color}"/>
      <text x="${x + barW / 2}" y="${H - 5}" font-size="9" fill="#63706A" text-anchor="middle">${d.gun}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" style="overflow:visible">
    <line x1="${padL}" y1="${zeroY}" x2="${W - padR}" y2="${zeroY}" stroke="#DBDFD5"/>
    ${bars}
  </svg>`;
}

function svgWeightChart(dates) {
  const W = 320, H = 190, padL = 30, padR = 30, padT = 12, padB = 20;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const n = dates.length || 1;
  const xStep = n > 1 ? plotW / (n - 1) : 0;
  const xOf = (i) => padL + i * xStep;

  const kgData = dates.map((iso) => { const w = state.weights.find((x) => x.date === iso); return w ? w.kg : null; });
  const kcalData = dates.map((iso) => { const t = sumEntries(state.entries.filter((e) => e.date === iso)); return t.kcal || null; });

  function buildLine(arr, yMin, yMax) {
    const yOf = (v) => padT + (1 - (v - yMin) / (yMax - yMin || 1)) * plotH;
    let segments = [], cur = [];
    arr.forEach((v, i) => {
      if (v === null || v === undefined) { if (cur.length) segments.push(cur); cur = []; }
      else cur.push([xOf(i), yOf(v)]);
    });
    if (cur.length) segments.push(cur);
    return segments.map((seg) => "M " + seg.map((p) => p.join(",")).join(" L "));
  }

  const kgValid = kgData.filter((v) => v !== null);
  const kgMin = kgValid.length ? Math.min(...kgValid) - 1 : 0, kgMax = kgValid.length ? Math.max(...kgValid) + 1 : 1;
  const kcalValid = kcalData.filter((v) => v !== null);
  const kcalMin = 0, kcalMax = kcalValid.length ? Math.max(...kcalValid) * 1.15 : 1;

  const kgPaths = buildLine(kgData, kgMin, kgMax).map((d) => `<path d="${d}" fill="none" stroke="#6E5A9E" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>`).join("");
  const kcalPaths = buildLine(kcalData, kcalMin, kcalMax).map((d) => `<path d="${d}" fill="none" stroke="#1B231E" stroke-opacity="0.3" stroke-width="1.5"/>`).join("");
  const labelStep = Math.max(1, Math.ceil(n / 6));
  const xLabels = dates.map((iso, i) => (i % labelStep === 0 || i === n - 1) ? `<text x="${xOf(i)}" y="${H - 5}" font-size="9" fill="#63706A" text-anchor="middle">${dateLabel(iso)}</text>` : "").join("");

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" style="overflow:visible">
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H - padB}" stroke="#DBDFD5"/>
    <line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="#DBDFD5"/>
    ${kcalPaths}
    ${kgPaths}
    ${xLabels}
  </svg>`;
}

/* ============================== RENDER: AYARLAR ============================== */

function renderSettings() {
  const s = state.settings;
  return `
  <main class="screen">
    <h2 class="screen-title">Hedefler &amp; Ayarlar</h2>

    <section class="card">
      <h3 class="card-title">Depolama Durumu</h3>
      <div class="storage-status ${usingCloud ? "cloud" : "local"}">
        ${usingCloud ? "☁️ Firebase Firestore (bulut)" : "💾 Yerel Depolama"}
      </div>
      <p class="muted small" style="margin-top:8px">
        ${usingCloud ? "Verilerin buluta kaydediliyor; hangi cihazdan girersen gir aynı veriyi görürsün." : "Veriler sadece bu cihazda/tarayıcıda saklanıyor. Buluta bağlamak için Firebase kurulumunu tamamla."}
      </p>
    </section>

    <section class="card">
      <p class="muted small" style="margin-bottom:12px">Bu değerler antrenörün belirlediği hedeflerdir. Değişiklik yaptıktan sonra kaydetmeyi unutma.</p>
      ${settingsField("Hedef kalori (kcal)", "calories", s.calories)}
      ${settingsField("Protein (g)", "protein", s.protein)}
      ${settingsField("Karbonhidrat (g)", "carb", s.carb)}
      ${settingsField("Yağ (g)", "fat", s.fat)}
      ${settingsField("Lif (g) — opsiyonel, 0 = kapalı", "fiber", s.fiber)}
      ${settingsField("Su (ml) — opsiyonel, 0 = kapalı", "water", s.water)}
      <button class="btn primary full" data-action="save-settings">${state.savedFlash ? icon("check", 16) + " Kaydedildi" : "Kaydet"}</button>
    </section>

    <section class="card">
      <h3 class="card-title">Antrenörle paylaşım</h3>
      <p class="muted small" style="margin-bottom:10px">Antrenör panelin yok; verilerini dışa aktarıp kendisiyle paylaşabilirsin.</p>
      <button class="btn ghost full" data-action="open-export">${icon("download", 16)} Verileri dışa aktar (CSV)</button>
    </section>

    <section class="card">
      <h3 class="card-title">Veri yönetimi</h3>
      <button class="btn danger-ghost full" data-action="request-reset">${icon("trash", 16)} Tüm verileri sıfırla</button>
    </section>
    <div class="bottom-spacer"></div>
  </main>`;
}
function settingsField(label, id, value) {
  return `<label class="field"><span>${label}</span><input type="number" inputmode="decimal" id="set_${id}" value="${value}"></label>`;
}

/* ============================== MODALLAR ============================== */

function renderModals() {
  let html = "";
  if (state.modal === "add" && modalState) html += renderAddModal();
  if (state.modal === "weight") html += renderWeightModal();
  if (state.modal === "export") html += renderExportModal();
  if (state.confirmDelete) html += renderConfirmModal("Kaydı sil", "Bu yemek kaydını silmek istediğine emin misin?", "confirm-delete", "cancel-delete", true);
  if (state.confirmReset) html += renderConfirmModal("Tüm verileri sıfırla", "Hedeflerin ve tüm yemek kayıtların kalıcı olarak silinecek. Bu işlem geri alınamaz.", "confirm-reset", "cancel-reset", true);
  return html;
}

function renderConfirmModal(title, body, confirmAction, cancelAction, danger) {
  return `<div class="overlay" data-action="${cancelAction}">
    <div class="sheet small" data-action="noop">
      <h3>${title}</h3><p class="muted">${body}</p>
      <div class="row-2">
        <button class="btn ghost" data-action="${cancelAction}">Vazgeç</button>
        <button class="btn ${danger ? "danger" : "primary"}" data-action="${confirmAction}">Onayla</button>
      </div>
    </div>
  </div>`;
}

function renderAddModal() {
  const isEdit = !!modalState.editId;
  const m = modalState.manual;
  const inner = `
      <div class="manual-panel">
        <label class="field"><span>Yemek adı</span><input id="manual_name" value="${esc(m.name)}" placeholder="örn: Ev yapımı mercimek yemeği" autofocus></label>
        <label class="field"><span>Porsiyon / miktar açıklaması</span><input id="manual_portion" value="${esc(m.portion)}" placeholder="örn: 1 kase, 150g, 2 dilim"></label>
        <div class="row-2">
          <label class="field"><span>Kalori (kcal)</span><input type="number" inputmode="decimal" id="manual_kcal" value="${m.kcal}"></label>
          <label class="field"><span>Protein (g)</span><input type="number" inputmode="decimal" id="manual_protein" value="${m.protein}"></label>
        </div>
        <div class="row-2">
          <label class="field"><span>Karbonhidrat (g)</span><input type="number" inputmode="decimal" id="manual_carb" value="${m.carb}"></label>
          <label class="field"><span>Yağ (g)</span><input type="number" inputmode="decimal" id="manual_fat" value="${m.fat}"></label>
        </div>
        <label class="field"><span>Lif (g) — opsiyonel</span><input type="number" inputmode="decimal" id="manual_fiber" value="${m.fiber}"></label>
        ${renderMealAndTime()}
        <button class="btn primary full" data-action="confirm-add-manual">${isEdit ? "Güncelle" : "Ekle"}</button>
      </div>`;

  return `<div class="overlay" data-action="close-modal">
    <div class="sheet" data-action="noop">
      <div class="sheet-head"><h3>${isEdit ? "Kaydı düzenle" : "Yemek ekle"}</h3><button class="icon-btn" data-action="close-modal">${icon("x", 20)}</button></div>
      ${inner}
    </div>
  </div>`;
}

function renderMealAndTime() {
  return `<div class="meal-time-row">
    <div class="row-4">
      ${MEAL_ORDER.map((m) => `<button class="chip ${modalState.meal === m ? "chip-active" : ""}" data-action="set-meal" data-meal="${m}">${MEAL_LABELS[m]}</button>`).join("")}
    </div>
    <input type="time" class="date-input full" id="entryTimeInput" value="${modalState.time}" style="margin-top:8px">
  </div>`;
}

function renderWeightModal() {
  return `<div class="overlay" data-action="close-modal">
    <div class="sheet small" data-action="noop">
      <div class="sheet-head"><h3>Kilo ekle</h3><button class="icon-btn" data-action="close-modal">${icon("x", 20)}</button></div>
      <label class="field"><span>Tarih</span><input type="date" id="weightDateInput" value="${todayISO()}"></label>
      <label class="field"><span>Kilo (kg)</span><input type="number" inputmode="decimal" id="weightKgInput" placeholder="örn: 72.4"></label>
      <button class="btn primary full" data-action="confirm-add-weight">Kaydet</button>
    </div>
  </div>`;
}

function renderExportModal() {
  const csv = buildCSV();
  return `<div class="overlay" data-action="close-modal">
    <div class="sheet" data-action="noop">
      <div class="sheet-head"><h3>Verileri dışa aktar</h3><button class="icon-btn" data-action="close-modal">${icon("x", 20)}</button></div>
      <p class="muted small" style="margin-bottom:8px">Aşağıdaki metni kopyalayıp antrenörünle paylaşabilirsin (CSV formatında).</p>
      <textarea class="export-area" id="csvArea" readonly onclick="this.select()">${esc(csv)}</textarea>
      <button class="btn primary full" id="copyCsvBtn" data-action="copy-csv">Panoya kopyala</button>
    </div>
  </div>`;
}
function buildCSV() {
  const header = "Tarih,Ogun,Yemek,Porsiyon,Kalori,Protein,Karbonhidrat,Yag,Lif,Saat";
  const rows = [...state.entries].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time))
    .map((e) => [e.date, MEAL_LABELS[e.meal] || e.meal, `"${e.name.replace(/"/g, '""')}"`, `"${(e.portion || "").replace(/"/g, '""')}"`, Math.round(e.kcal), fmt1(e.protein), fmt1(e.carb), fmt1(e.fat), fmt1(e.fiber || 0), e.time].join(","));
  return [header, ...rows].join("\n");
}

/* ============================== OLAY YÖNETİMİ ============================== */

document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.dataset.action;

  try {
  switch (action) {
    case "set-tab": state.tab = btn.dataset.tab; render(); break;
    case "prev-day": state.selectedDate = addDays(state.selectedDate, -1); render(); break;
    case "next-day": state.selectedDate = addDays(state.selectedDate, 1); render(); break;

    case "open-add":
      modalState = { editId: null, meal: guessMeal(), time: nowTime(), date: state.selectedDate,
        manual: { name: "", portion: "", kcal: "", protein: "", carb: "", fat: "", fiber: "" } };
      state.modal = "add"; render(); break;
    case "open-add-today":
      state.selectedDate = todayISO();
      modalState = { editId: null, meal: guessMeal(), time: nowTime(), date: todayISO(),
        manual: { name: "", portion: "", kcal: "", protein: "", carb: "", fat: "", fiber: "" } };
      state.modal = "add"; render(); break;
    case "open-edit": {
      const entry = state.entries.find((x) => x.id === btn.dataset.id);
      if (!entry) return;
      modalState = { editId: entry.id, meal: entry.meal, time: entry.time, date: entry.date,
        manual: { name: entry.name, portion: entry.portion || "", kcal: entry.kcal, protein: entry.protein, carb: entry.carb, fat: entry.fat, fiber: entry.fiber || 0 } };
      state.modal = "add"; render(); break;
    }
    case "close-modal": state.modal = null; modalState = null; render(); break;

    case "set-meal": modalState.meal = btn.dataset.meal; render(); break;

    case "confirm-add-manual": {
      const name = document.getElementById("manual_name")?.value.trim();
      if (!name) return;
      const timeVal = document.getElementById("entryTimeInput")?.value || modalState.time;
      const portion = document.getElementById("manual_portion")?.value.trim() || "";
      saveEntryFromModal({
        date: modalState.date, meal: modalState.meal, time: timeVal, name, portion,
        kcal: Number(document.getElementById("manual_kcal")?.value) || 0,
        protein: Number(document.getElementById("manual_protein")?.value) || 0,
        carb: Number(document.getElementById("manual_carb")?.value) || 0,
        fat: Number(document.getElementById("manual_fat")?.value) || 0,
        fiber: Number(document.getElementById("manual_fiber")?.value) || 0,
      });
      break;
    }

    case "request-delete": state.confirmDelete = btn.dataset.id; render(); break;
    case "cancel-delete": state.confirmDelete = null; render(); break;
    case "confirm-delete": deleteEntry(state.confirmDelete); break;

    case "request-reset": state.confirmReset = true; render(); break;
    case "cancel-reset": state.confirmReset = false; render(); break;
    case "confirm-reset": resetAll(); break;

    case "add-water": addWater(state.selectedDate, Number(btn.dataset.ml)); break;

    case "select-log-date": state.selectedDate = btn.dataset.date; state.tab = "today"; render(); break;

    case "set-range": {
      const r = btn.dataset.range;
      state.range = r === "custom" ? "custom" : Number(r);
      render(); break;
    }

    case "save-settings": {
      const next = {
        calories: Number(document.getElementById("set_calories")?.value) || 0,
        protein: Number(document.getElementById("set_protein")?.value) || 0,
        carb: Number(document.getElementById("set_carb")?.value) || 0,
        fat: Number(document.getElementById("set_fat")?.value) || 0,
        fiber: Number(document.getElementById("set_fiber")?.value) || 0,
        water: Number(document.getElementById("set_water")?.value) || 0,
      };
      state.settings = next;
      persist("settings", next);
      state.savedFlash = true; render();
      setTimeout(() => { state.savedFlash = false; if (state.tab === "settings") render(); }, 1600);
      break;
    }

    case "open-export": state.modal = "export"; render(); break;
    case "copy-csv": {
      const area = document.getElementById("csvArea");
      navigator.clipboard.writeText(area.value).then(() => {
        const b = document.getElementById("copyCsvBtn");
        if (b) b.innerHTML = `${icon("check", 16)} Kopyalandı`;
      }).catch(() => { area.select(); document.execCommand && document.execCommand("copy"); });
      break;
    }

    case "open-weight": state.modal = "weight"; render(); break;
    case "confirm-add-weight": {
      const d = document.getElementById("weightDateInput")?.value || todayISO();
      const kg = Number(document.getElementById("weightKgInput")?.value);
      if (!kg) return;
      addWeight(d, kg);
      break;
    }
  }
  } catch (err) { showFatalError((action || "?") + ": " + err.message); }
});

document.addEventListener("change", (e) => {
  try {
  if (e.target.id === "todayDateInput") { state.selectedDate = e.target.value; render(); }
  if (e.target.id === "customFromInput") { state.customFrom = e.target.value; render(); }
  if (e.target.id === "customToInput") { state.customTo = e.target.value; render(); }
  } catch (err) { showFatalError("change: " + err.message); }
});

/* ============================== HATA YAKALAMA (tanı için) ============================== */

function showFatalError(msg) {
  console.error("YAKALANAN HATA:", msg);
  let banner = document.getElementById("fatalErrorBanner");
  if (!banner) {
    banner = document.createElement("div");
    banner.id = "fatalErrorBanner";
    banner.style.cssText = "position:fixed;top:0;left:0;right:0;background:#C4622E;color:#fff;padding:10px 14px;font-family:sans-serif;font-size:12px;z-index:9999;line-height:1.4;";
    document.body.prepend(banner);
  }
  banner.textContent = "Bir hata oluştu: " + msg;
}
window.addEventListener("error", (e) => showFatalError(e.message));
window.addEventListener("unhandledrejection", (e) => showFatalError(String(e.reason)));

/* ============================== BAŞLAT ============================== */
loadData();
</script>
